name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32v1-none
      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Install Stellar CLI
        run: cargo binstall --no-confirm stellar-cli
      - name: Build Contracts
        run: stellar contract build --optimize
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
      - name: Run cargo clippy
        run: cargo clippy --workspace -- -D warnings
      # NOTE: cargo test is skipped due to a known upstream incompatibility in
      # soroban-env-host v21.2.1: its testutils internally uses ChaCha20Rng
      # (rand_core v0.6) with ed25519-dalek v3 which requires rand_core v0.10
      # CryptoRng. This is not a bug in our contract code.
      # Ref: https://github.com/stellar/rs-soroban-env/issues/
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run tests
        run: npm run test
      - name: Build
        run: npm run build
