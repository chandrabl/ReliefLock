[workspace]
resolver = "2"
members = [
    "contracts/relieflock-contract",
]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# Pin soroban-sdk to avoid upstream soroban-env-host 21.2.1 / ed25519-dalek v3
# incompatibility: soroban-env-host testutils uses ChaCha20Rng (rand_core 0.6)
# but ed25519-dalek v3 requires rand_core 0.10 CryptoRng. The fix is to constrain
# the soroban-sdk version to one that uses ed25519-dalek v2 internally.
